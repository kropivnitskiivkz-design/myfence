name: Build PecoFence

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "PecoFence.zip"

          if (-not (Test-Path -LiteralPath $zip)) {
            throw "PecoFence.zip not found"
          }

          $dst = Join-Path $env:RUNNER_TEMP "pecofence-source"

          if (Test-Path -LiteralPath $dst) {
            Remove-Item -LiteralPath $dst -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dst | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force

          $cargo = Get-ChildItem -LiteralPath $dst `
            -Filter "Cargo.toml" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $cargo) {
            throw "Cargo.toml not found"
          }

          Add-Content `
            -LiteralPath $env:GITHUB_ENV `
            -Value "PROJECT_DIR=$($cargo.Directory.FullName)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable package
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:PROJECT_DIR

          & ".\scripts\make-portable.ps1"

          if ($LASTEXITCODE -ne 0) {
            throw "Portable build failed"
          }

      - name: Extract portable package
        shell: pwsh
        run: |
          $dist = Join-Path $env:PROJECT_DIR "dist"

          $package = Get-ChildItem `
            -LiteralPath $dist `
            -Filter "pecofence-*-x64.zip" `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package) {
            throw "Portable package not found"
          }

          $portable = Join-Path `
            $env:GITHUB_WORKSPACE `
            "PecoFence-Portable"

          if (Test-Path -LiteralPath $portable) {
            Remove-Item `
              -LiteralPath $portable `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $portable |
            Out-Null

          Expand-Archive `
            -LiteralPath $package.FullName `
            -DestinationPath $portable `
            -Force

          Write-Host "Portable files:"
          Get-ChildItem `
            -LiteralPath $portable `
            -Recurse |
            Select-Object FullName

          $loader = Get-ChildItem `
            -LiteralPath $portable `
            -Filter "WebView2Loader.dll" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $loader) {
            throw "WebView2Loader.dll missing from portable package"
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: PecoFence-Portable
          path: PecoFence-Portable/
          if-no-files-found: error
