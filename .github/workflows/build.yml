name: Build PecoFence

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: cmd
        run: |
          if not exist "%GITHUB_WORKSPACE%\PecoFence.zip" (
            echo ERROR: PecoFence.zip not found
            exit /b 1
          )

          if exist "%RUNNER_TEMP%\pecofence-source" (
            rmdir /s /q "%RUNNER_TEMP%\pecofence-source"
          )

          mkdir "%RUNNER_TEMP%\pecofence-source"

          tar -xf "%GITHUB_WORKSPACE%\PecoFence.zip" -C "%RUNNER_TEMP%\pecofence-source"

          if errorlevel 1 (
            echo ERROR: Failed to extract PecoFence.zip
            exit /b 1
          )

          for /r "%RUNNER_TEMP%\pecofence-source" %%F in (Cargo.toml) do (
            echo PROJECT_DIR=%%~dpF>>"%GITHUB_ENV%"
            echo Project found: %%~dpF
            goto :found
          )

          echo ERROR: Cargo.toml not found
          exit /b 1

          :found

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable package
        shell: pwsh
        run: |
          Write-Host "Project directory: $env:PROJECT_DIR"

          if (-not (Test-Path -LiteralPath $env:PROJECT_DIR)) {
            throw "PROJECT_DIR does not exist"
          }

          Set-Location -LiteralPath $env:PROJECT_DIR

          if (-not (Test-Path -LiteralPath ".\scripts\make-portable.ps1")) {
            throw "scripts\make-portable.ps1 not found"
          }

          & ".\scripts\make-portable.ps1"

          if ($LASTEXITCODE -ne 0) {
            throw "Portable build failed with exit code $LASTEXITCODE"
          }

      - name: Extract portable package
        shell: pwsh
        run: |
          $dist = Join-Path $env:PROJECT_DIR "dist"

          if (-not (Test-Path -LiteralPath $dist)) {
            throw "dist directory not found"
          }

          Write-Host "Contents of dist:"
          Get-ChildItem -LiteralPath $dist -Force

          $package = Get-ChildItem `
            -LiteralPath $dist `
            -Filter "pecofence-*-x64.zip" `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package) {
            throw "Portable package not found"
          }

          Write-Host "Portable package: $($package.FullName)"

          $portable = Join-Path `
            $env:GITHUB_WORKSPACE `
            "PecoFence-Portable"

          if (Test-Path -LiteralPath $portable) {
            Remove-Item `
              -LiteralPath $portable `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $portable |
            Out-Null

          tar -xf $package.FullName -C $portable

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract portable package"
          }

          Write-Host "Portable files:"

          Get-ChildItem `
            -LiteralPath $portable `
            -Recurse |
            Select-Object FullName

          $mainExe = Get-ChildItem `
            -LiteralPath $portable `
            -Filter "pecofence.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $mainExe) {
            throw "pecofence.exe missing from portable package"
          }

          $loader = Get-ChildItem `
            -LiteralPath $portable `
            -Filter "WebView2Loader.dll" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $loader) {
            throw "WebView2Loader.dll missing from portable package"
          }

          Write-Host "pecofence.exe OK"
          Write-Host "WebView2Loader.dll OK"

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: PecoFence-Portable
          path: PecoFence-Portable/
          if-no-files-found: error
          retention-days: 7
