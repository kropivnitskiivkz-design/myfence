name: Build PecoFence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: cmd
        run: |
          echo Checking source archive...

          if not exist "%GITHUB_WORKSPACE%\PecoFence.zip" (
            echo ERROR: PecoFence.zip not found
            exit /b 1
          )

          if exist "%RUNNER_TEMP%\pecofence-source" (
            rmdir /s /q "%RUNNER_TEMP%\pecofence-source"
          )

          mkdir "%RUNNER_TEMP%\pecofence-source"

          tar -xf "%GITHUB_WORKSPACE%\PecoFence.zip" -C "%RUNNER_TEMP%\pecofence-source"

          if errorlevel 1 (
            echo ERROR: Failed to extract PecoFence.zip
            exit /b 1
          )

          for /r "%RUNNER_TEMP%\pecofence-source" %%F in (Cargo.toml) do (
            echo PROJECT_DIR=%%~dpF>>"%GITHUB_ENV%"
            echo Project found: %%~dpF
            goto :found
          )

          echo ERROR: Cargo.toml not found
          exit /b 1

          :found

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable package
        shell: pwsh
        run: |
          Write-Host "Project directory: $env:PROJECT_DIR"

          if (-not (Test-Path -LiteralPath $env:PROJECT_DIR)) {
            throw "PROJECT_DIR does not exist"
          }

          Set-Location -LiteralPath $env:PROJECT_DIR

          if (-not (Test-Path -LiteralPath ".\scripts\make-portable.ps1")) {
            throw "scripts\make-portable.ps1 not found"
          }

          & ".\scripts\make-portable.ps1"

          if ($LASTEXITCODE -ne 0) {
            throw "Portable build failed with exit code $LASTEXITCODE"
          }

      - name: Find portable package
        shell: pwsh
        run: |
          $dist = Join-Path $env:PROJECT_DIR "dist"

          if (-not (Test-Path -LiteralPath $dist)) {
            throw "dist directory not found"
          }

          Write-Host "Contents of dist:"
          Get-ChildItem -LiteralPath $dist -Force

          $package = Get-ChildItem `
            -LiteralPath $dist `
            -Filter "pecofence-*-x64.zip" `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package) {
            throw "Portable package not found"
          }

          $releaseFile = Join-Path `
            $env:GITHUB_WORKSPACE `
            "PecoFence-Portable.zip"

          Copy-Item `
            -LiteralPath $package.FullName `
            -Destination $releaseFile `
            -Force

          if (-not (Test-Path -LiteralPath $releaseFile)) {
            throw "Failed to prepare release ZIP"
          }

          $size = (Get-Item -LiteralPath $releaseFile).Length

          Write-Host "Release package:"
          Write-Host $releaseFile
          Write-Host "Size: $size bytes"

          if ($size -lt 100000) {
            throw "Release ZIP is unexpectedly small"
          }

      - name: Generate release tag
        shell: pwsh
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"

          Add-Content `
            -LiteralPath $env:GITHUB_ENV `
            -Value "RELEASE_TAG=$tag"

          Write-Host "Release tag: $tag"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PecoFence ${{ env.RELEASE_TAG }}
          body: |
            Automated Windows x64 portable build of PecoFence.

            This build includes the Windows compatibility changes.
          prerelease: true
          files: |
            PecoFence-Portable.zip
