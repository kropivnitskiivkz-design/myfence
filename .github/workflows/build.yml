name: Build PecoFence ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PecoFence.zip
        shell: pwsh
        run: |
          if (-not (Test-Path "PecoFence.zip")) { throw "PecoFence.zip was not found in repository root" }
          New-Item -ItemType Directory -Force -Path source | Out-Null
          Expand-Archive -LiteralPath "PecoFence.zip" -DestinationPath source -Force
          $cargo = Get-ChildItem source -Filter Cargo.toml -Recurse | Select-Object -First 1
          if (-not $cargo) { throw "Cargo.toml was not found inside PecoFence.zip" }
          "PROJECT_DIR=$($cargo.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust 1.95
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Build and package portable ZIP
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          & .\scripts\make-portable.ps1

      - name: Locate portable package
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:PROJECT_DIR\dist" -Filter "pecofence-*-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "Portable ZIP was not produced" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifact" | Out-Null
          Copy-Item $zip.FullName "$env:GITHUB_WORKSPACE\artifact\PecoFence-Windows-x64.zip"

      - name: Upload ready-to-run ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PecoFence-Windows-x64
          path: artifact/PecoFence-Windows-x64.zip
          if-no-files-found: error
